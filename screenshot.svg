<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" fill="url(#bg)"/>

  <!-- Header -->
  <text x="450" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="bold">🎉 2025 Git Annual Summary</text>
  <text x="450" y="80" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" opacity="0.9">📁 my-awesome-project</text>

  <!-- Summary Card -->
  <rect x="50" y="100" width="800" height="80" rx="16" fill="white" filter="url(#shadow)"/>
  <text x="450" y="140" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Thanks for 2025 🎊</text>
  <text x="450" y="165" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="14">Sigma grindset activated! Rise and grind 🐂🐴</text>

  <!-- Row 1 -->
  <rect x="50" y="200" width="250" height="120" rx="16" fill="url(#highlight)" filter="url(#shadow)"/>
  <text x="175" y="240" text-anchor="middle" font-size="28">📝</text>
  <text x="175" y="280" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">1,234</text>
  <text x="175" y="305" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">COMMITS</text>

  <rect x="325" y="200" width="250" height="120" rx="16" fill="white" filter="url(#shadow)"/>
  <text x="450" y="240" text-anchor="middle" font-size="28">📊</text>
  <text x="450" y="280" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="28" font-weight="bold">23.7</text>
  <text x="450" y="305" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">WEEKLY COMMITS</text>

  <rect x="600" y="200" width="250" height="120" rx="16" fill="white" filter="url(#shadow)"/>
  <text x="725" y="240" text-anchor="middle" font-size="28">➕</text>
  <text x="725" y="280" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="28" font-weight="bold">89,432</text>
  <text x="725" y="305" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">LINES ADDED</text>

  <!-- Row 2 -->
  <rect x="50" y="340" width="250" height="120" rx="16" fill="white" filter="url(#shadow)"/>
  <text x="175" y="380" text-anchor="middle" font-size="28">➖</text>
  <text x="175" y="420" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="28" font-weight="bold">34,521</text>
  <text x="175" y="445" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">LINES DELETED</text>

  <rect x="325" y="340" width="250" height="120" rx="16" fill="white" filter="url(#shadow)"/>
  <text x="450" y="380" text-anchor="middle" font-size="28">📅</text>
  <text x="450" y="420" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="28" font-weight="bold">186</text>
  <text x="450" y="445" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">ACTIVE DAYS</text>

  <rect x="600" y="340" width="250" height="120" rx="16" fill="white" filter="url(#shadow)"/>
  <text x="725" y="380" text-anchor="middle" font-size="28">💼</text>
  <text x="725" y="420" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="28" font-weight="bold">75.0%</text>
  <text x="725" y="445" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">WORKDAY RATIO</text>

  <!-- Row 3 -->
  <rect x="50" y="480" width="250" height="120" rx="16" fill="white" filter="url(#shadow)"/>
  <text x="175" y="520" text-anchor="middle" font-size="28">🌅</text>
  <text x="175" y="560" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="28" font-weight="bold">06:32</text>
  <text x="175" y="585" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">EARLIEST TIME</text>

  <rect x="325" y="480" width="250" height="120" rx="16" fill="white" filter="url(#shadow)"/>
  <text x="450" y="520" text-anchor="middle" font-size="28">🐂</text>
  <text x="450" y="560" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Mighty (3/4)</text>
  <text x="450" y="585" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">NIU INDEX</text>

  <rect x="600" y="480" width="250" height="120" rx="16" fill="white" filter="url(#shadow)"/>
  <text x="725" y="520" text-anchor="middle" font-size="28">🐴</text>
  <text x="725" y="560" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="28" font-weight="bold">Legend (4/4)</text>
  <text x="725" y="585" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">MA INDEX</text>

  <!-- Footer -->
  <text x="450" y="640" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" opacity="0.8">Generated at: 2025-12-31 12:00:00</text>
</svg>
